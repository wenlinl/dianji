  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#dianji-flow{--dji-surface:light-dark(#fffdfa,#241f1a);--dji-ink:light-dark(#2b2118,#f3e9dc);--dji-muted:light-dark(#8a7663,#b8a894);--dji-border:light-dark(#f0e2d4,#3a3128);--dji-primary:#e8590c;--dji-primary-ink:#fff;--dji-soft:light-dark(#fdeadd,#3a2a1d);--dji-good:#2f9e44;--dji-good-soft:light-dark(#e8f5ea,#1f3323);--dji-warn:light-dark(#f59f00,#ffd43b);--dji-shadow:0 18px 44px rgba(0,0,0,.14)}

&lt;script&gt;
(function(){
  var root=document.getElementById(&#x27;dianji-flow&#x27;);
  var screens=root.querySelectorAll(&#x27;[data-screen]&#x27;);
  var nav=root.querySelectorAll(&#x27;.dji-nav button&#x27;);
  var order=[&#x27;home&#x27;,&#x27;direction&#x27;,&#x27;conversation&#x27;,&#x27;confirm&#x27;,&#x27;sent&#x27;];
  var steps=[
    {chip:&#x27;第 1 步 · 共 3 步&#x27;,text:&#x27;我看到微信里那篇文章了。&lt;br&gt;点右上角那三个点（···）。&#x27;},
    {chip:&#x27;第 2 步 · 共 3 步&#x27;,text:&#x27;点「分享给朋友」。&lt;br&gt;然后选「家庭群」。&#x27;},
    {chip:&#x27;第 3 步 · 共 3 步&#x27;,text:&#x27;选好了就点「发送」。&lt;br&gt;好了就跟我说一声。&#x27;}
  ];
  var stepIdx=0,dir=&#x27;screen&#x27;;
  var ovIdx=0;
  var ovBox=null;
  function show(name){
    screens.forEach(function(s){s.classList.toggle(&#x27;active&#x27;,s.getAttribute(&#x27;data-screen&#x27;)===name);});
    nav.forEach(function(b){b.classList.toggle(&#x27;on&#x27;,b.getAttribute(&#x27;data-goto&#x27;)===name);});
  }
  function renderStep(){
    if(stepIdx&lt;steps.length){
      root.querySelector(&#x27;#dji-step-chip&#x27;).textContent=steps[stepIdx].chip;
      root.querySelector(&#x27;#dji-step-text&#x27;).innerHTML=steps[stepIdx].text;
      root.querySelector(&#x27;#dji-done&#x27;).textContent=&#x27;这步好了&#x27;;
      root.querySelector(&#x27;#dji-stuck&#x27;).style.display=&#x27;&#x27;;
    }
  }
  function renderOv(){
    if(ovIdx&lt;steps.length){
      root.querySelector(&#x27;#dji-ov-chip&#x27;).textContent=steps[ovIdx].chip;
      root.querySelector(&#x27;#dji-ov-text&#x27;).innerHTML=steps[ovIdx].text;
      root.querySelector(&#x27;#dji-ov-status&#x27;).textContent=&#x27;自动确认中&#x27;;
    }
  }
  root.querySelectorAll(&#x27;[data-goto]&#x27;).forEach(function(b){
    b.addEventListener(&#x27;click&#x27;,function(){show(b.getAttribute(&#x27;data-goto&#x27;));});
  });
  root.querySelectorAll(&#x27;[data-dir]&#x27;).forEach(function(b){
    b.addEventListener(&#x27;click&#x27;,function(){
      dir=b.getAttribute(&#x27;data-dir&#x27;);
      root.querySelector(&#x27;#dji-status-text&#x27;).textContent=dir===&#x27;camera&#x27;?&#x27;摄像头已打开，我正看着你拍到的东西&#x27;:&#x27;正在看你的屏幕&#x27;;
      stepIdx=0;renderStep();
      show(&#x27;conversation&#x27;);
    });
  });
  root.querySelector(&#x27;#dji-demo-next&#x27;).addEventListener(&#x27;click&#x27;,function(){
    if(stepIdx&lt;steps.length-1){stepIdx++;renderStep();}
    else{
      root.querySelector(&#x27;#dji-step-text&#x27;).innerHTML=&#x27;都弄好啦！&lt;br&gt;你成功了。&#x27;;
      root.querySelector(&#x27;#dji-step-chip&#x27;).textContent=&#x27;完成&#x27;;
      var d=root.querySelector(&#x27;#dji-demo-next&#x27;);d.textContent=&#x27;回到首页&#x27;;
      d.addEventListener(&#x27;click&#x27;,function(){show(&#x27;home&#x27;);});
    }
  });
  root.querySelector(&#x27;#dji-stuck&#x27;).addEventListener(&#x27;click&#x27;,function(){show(&#x27;confirm&#x27;);});
  root.querySelector(&#x27;#dji-forward&#x27;).addEventListener(&#x27;click&#x27;,function(){show(&#x27;confirm&#x27;);});
  var voiceStatus=root.querySelector(&#x27;#dji-voice-status&#x27;);
  function say(cmd,note){
    voiceStatus.textContent=&#x27;你说了：&#x27;+cmd+&#x27; —— &#x27;+note;
    setTimeout(function(){voiceStatus.textContent=&#x27;&#x27;;},2600);
  }
  root.querySelector(&#x27;#dji-replay&#x27;).addEventListener(&#x27;click&#x27;,function(){say(&#x27;再讲一遍&#x27;,&#x27;我再念一遍给你听&#x27;);});
  root.querySelector(&#x27;#dji-v-replay&#x27;).addEventListener(&#x27;click&#x27;,function(){say(&#x27;再讲一遍&#x27;,&#x27;我再念一遍给你听&#x27;);});
  root.querySelector(&#x27;#dji-v-next&#x27;).addEventListener(&#x27;click&#x27;,function(){
    say(&#x27;下一步&#x27;,&#x27;好，继续&#x27;);
    setTimeout(function(){root.querySelector(&#x27;#dji-demo-next&#x27;).click();},350);
  });
  root.querySelector(&#x27;#dji-v-stuck&#x27;).addEventListener(&#x27;click&#x27;,function(){say(&#x27;卡住了&#x27;,&#x27;我重新看看你的屏幕&#x27;);setTimeout(function(){show(&#x27;confirm&#x27;);},450);});
  root.querySelector(&#x27;#dji-v-forward&#x27;).addEventListener(&#x27;click&#x27;,function(){say(&#x27;叫家里人&#x27;,&#x27;好，把对话发给家里人&#x27;);setTimeout(function(){show(&#x27;confirm&#x27;);},450);});
  root.querySelector(&#x27;#dji-show-ov&#x27;).addEventListener(&#x27;click&#x27;,function(){ovIdx=0;renderOv();show(&#x27;overlay&#x27;);});
  ovBox=root.querySelector(&#x27;#dji-ov-box&#x27;);
  root.querySelector(&#x27;#dji-ov-min&#x27;).addEventListener(&#x27;click&#x27;,function(){ovBox.classList.add(&#x27;min&#x27;);});
  root.querySelector(&#x27;#dji-ov-min-voice&#x27;).addEventListener(&#x27;click&#x27;,function(){ovBox.classList.add(&#x27;min&#x27;);});
  root.querySelector(&#x27;#dji-ov-open-voice&#x27;).addEventListener(&#x27;click&#x27;,function(){ovBox.classList.remove(&#x27;min&#x27;);});
  ovBox.addEventListener(&#x27;click&#x27;,function(e){
    if(ovBox.classList.contains(&#x27;min&#x27;)){e.stopPropagation();ovBox.classList.remove(&#x27;min&#x27;);}
  });
  root.querySelector(&#x27;#dji-ov-next&#x27;).addEventListener(&#x27;click&#x27;,function(){
    if(ovIdx&lt;steps.length-1){ovIdx++;renderOv();root.querySelector(&#x27;#dji-ov-status&#x27;).textContent=&#x27;✓ 上一步已确认&#x27;;}
    else{
      root.querySelector(&#x27;#dji-ov-text&#x27;).innerHTML=&#x27;都弄好啦！&lt;br&gt;你成功了。&#x27;;
      root.querySelector(&#x27;#dji-ov-chip&#x27;).textContent=&#x27;完成&#x27;;
      root.querySelector(&#x27;#dji-ov-status&#x27;).textContent=&#x27;✓ 全部确认&#x27;;
      root.querySelector(&#x27;#dji-ov-next&#x27;).textContent=&#x27;返回对话&#x27;;
      root.querySelector(&#x27;#dji-ov-next&#x27;).addEventListener(&#x27;click&#x27;,function(){show(&#x27;conversation&#x27;);});
    }
  });
  root.querySelector(&#x27;#dji-send&#x27;).addEventListener(&#x27;click&#x27;,function(){show(&#x27;sent&#x27;);});
  root.querySelectorAll(&#x27;[data-mark]&#x27;).forEach(function(b){
    b.addEventListener(&#x27;click&#x27;,function(){
      var card=root.querySelector(&#x27;#&#x27;+b.getAttribute(&#x27;data-mark&#x27;));
      if(card){card.classList.add(&#x27;done&#x27;);b.textContent=&#x27;已办好&#x27;;b.disabled=true;}
    });
  });
  show(&#x27;home&#x27;);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
